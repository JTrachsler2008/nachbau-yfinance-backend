# Dev-Profil: startet das Backend ohne Docker und ohne Postgres gegen eine dateibasierte H2.
# Zweck ist die lokale Frontend-Entwicklung - das Frontend braucht ein erreichbares Backend, und
# auf diesem Rechner ist kein Docker installiert, mit dem docker-compose.yml Postgres starten
# könnte.
#
# Die Flyway-Migrationen aus db/migration laufen unverändert durch, dieselbe Kombination nutzen
# auch die Backend-Tests (src/test/resources/application-test.properties). Damit weicht das Schema
# hier nicht von Postgres ab.
#
# Dateibasiert statt in-memory, damit registrierte Benutzer und angelegte Portfolios einen
# Neustart überleben. Die Datei liegt unter target/ und ist damit von .gitignore erfasst und von
# `mvnw clean` erfasst - wer einen frischen Stand will, löscht das Verzeichnis.
#
# Für echte Nähe zur Produktion weiterhin Postgres per docker-compose starten und dieses Profil
# weglassen.
spring.datasource.url=jdbc:h2:file:./target/h2-dev/portfolio;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
