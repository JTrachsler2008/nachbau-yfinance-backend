spring.application.name=portfolio-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio
spring.datasource.username=portfolio
spring.datasource.password=portfolio

spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health

# Dev-Fallback nur für lokale Entwicklung - in echten Umgebungen über APP_JWT_SECRET setzen (SEC-3, kein Secret im Repo)
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-O2Pimtb6tKey9s08efyu8fa9gRJo2AD18SpYHu3SiX-do-not-use-in-prod}
app.jwt.expiration-minutes=60

# Refresh-Token im httpOnly-Cookie: so überlebt die Anmeldung einen Seiten-Reload, ohne dass das
# Zugriffs-Token den Speicher des Browsers verlässt (SEC-1/SEC-2).
app.refresh-token.expiration-days=14
# Lokal läuft die Entwicklung über http, wo der Browser ein Secure-Cookie verwirft. In echten
# Umgebungen (https) gehört das Flag auf true - deshalb konfigurierbar und nicht fest verdrahtet.
app.refresh-token.cookie-secure=${REFRESH_COOKIE_SECURE:false}

# Python-Microservice (yfinance-Wrapper) und AlphaVantage als Fallback-Kursquelle (SEC-3: kein API-Key im Repo)
app.market-data.yfinance.base-url=${YFINANCE_BASE_URL:http://localhost:8000}
app.market-data.alphavantage.base-url=${ALPHAVANTAGE_BASE_URL:https://www.alphavantage.co}
app.market-data.alphavantage.api-key=${ALPHAVANTAGE_API_KEY:}
app.market-data.circuit-breaker.failure-threshold=3
app.market-data.circuit-breaker.open-duration-seconds=30
